name: Deploy TEST app (test.lighthouse.career)

# 워크벤치(스테이징) — main push 시 자동 배포. apps/test → lighthouse-career-fe
on:
  push:
    branches:
      - main
  # GitHub 이 push 를 500 으로 거절했다 재시도로 받으면 이 워크플로가 안 도는 일이 있다(2026-11-04 두 번) — 그때 gh workflow run 으로
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test app
        run: pnpm --filter @lighthouse/test-app build
        env:
          VITE_API: https://api.lighthouse.career
          # 비회원 진입 경로(/start · /job/:code · 결과지·진로백과 잠금) — 운영(deploy-app)도 2026-11-12부터 켬
          VITE_GUEST_ENTRY: '1'
          # 진로백과 '분류로 찾기'(2026-11-17) — 운영(deploy-app)도 2026-11-18부터 켬
          VITE_JOB_BROWSE: '1'
          # 집중모드 '잠시 멈추고 홈으로 · 집중 취소'(2026-11-19) — 스테이징 사용성 QA 통과(11-20). 운영(deploy-app)도 켬
          VITE_FOCUS_PAUSE: '1'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 올리는 순서(2026-11-17 핫픽스): ① 새 파일을 먼저 ② 시작 파일(index.html·sw.js·registerSW.js·manifest)을 맨 나중에.
      # 옛 화면 파일(assets/)은 지우지 않는다 — 이미 열려 있던 화면이나 서비스 워커가 내준 옛 화면이 다음 화면 파일을 부를 때
      # 없으면 CloudFront 가 index.html 을 200 으로 줘서 이동이 멈췄다(아이폰 사파리는 복구도 안 됐다). 쌓이는 옛 파일 정리는 따로.
      # 시작 파일은 '매번 확인'(no-cache) — 브라우저가 옛 index.html 을 저장해 두고 내주지 않게.
      # uploads/ 는 진로달성 인증사진 prefix(같은 버킷) → --delete 제외
      - name: Upload new files first (keep old assets)
        run: >-
          aws s3 sync apps/test/dist/ s3://lighthouse-career-fe
          --exclude "uploads/*" --exclude "index.html" --exclude "sw.js"
          --exclude "registerSW.js" --exclude "manifest.webmanifest"

      - name: Upload entry files last and prune (except assets/ and uploads/)
        run: aws s3 sync apps/test/dist/ s3://lighthouse-career-fe --delete --exclude "uploads/*" --exclude "assets/*" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EYU43VZ4GPE7Q \
            --paths "/*"
