<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="196x196" href="/favicon-196.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- 검색·공유용 정보(2026-11-12). 목표: '라이트하우스' 검색에 서비스가 나오게 — 브랜드 표기는 한글이 먼저다(랜딩 www 와 같은 이름).
         이 파일은 모든 경로가 함께 쓰는 껍데기라 canonical·og:url 은 넣지 않는다(넣으면 모든 화면이 첫 화면과 같은 글이라고 알리게 된다).
         공유 그림은 랜딩의 것을 그대로 가리킨다. 홍보 링크(/start 등)를 카톡에 붙였을 때 뜨는 카드가 이 값이다 -->
    <title>라이트하우스</title>
    <meta name="description" content="라이트하우스(Lighthouse) — 자기이해 검사로 나에게 맞는 직무를 찾고, 진로백과에서 직업을 알아보고, 진로계획을 세워 실행하는 진로 서비스입니다.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="라이트하우스">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="라이트하우스 — 나의 진로를 비추는 빛">
    <meta property="og:description" content="자기이해 검사로 나에게 맞는 직무를 찾고, 진로백과에서 직업을 알아보고, 진로계획을 세워 실행하는 진로 서비스입니다.">
    <meta property="og:image" content="https://www.lighthouse.career/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
